<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历导航</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;        /* 收窄宽度，更适合垂直阅读 */
            margin: 0 auto;
            padding: 30px 20px;
            background-color: #f5f7fa;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 12px;
            display: inline-block;
            margin: 0 0 30px 0;
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        /* 垂直容器 — 关键修改 */
        .nav-container {
            display: flex;
            flex-direction: column;    /* 主轴为垂直方向 */
            align-items: center;       /* 卡片居中对齐 */
            gap: 20px;
            width: 100%;
            max-width: 450px;          /* 限制容器宽度，让卡片更舒适 */
            margin: 0 auto;
            padding: 10px 0 20px 0;
        }
        /* 卡片样式调整：宽度适应垂直容器，不再限制不换行 */
        .nav-card {
            background: white;
            border-radius: 16px;        /* 稍大圆角，更柔和 */
            padding: 22px 25px;          /* 上下内边距增加，更饱满 */
            width: 100%;                 /* 撑满容器宽度 */
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.3s, background-color 0.2s;
            text-decoration: none;
            color: #34495e;
            border-left: 6px solid transparent; /* 预留装饰条，hover时可变化 */
            text-align: left;            /* 左对齐更自然 */
            display: block;
            box-sizing: border-box;
        }
        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 30px rgba(52,152,219,0.15);
            background-color: #3498db;
            color: white;
            border-left-color: #1f4f7a;   /* 深色装饰条 */
        }
        /* 卡片内的标题排版 */
        .nav-card h2 {
            margin: 0;
            font-size: 1.4rem;           /* 稍微增大字体 */
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: normal;          /* 允许换行，防止长标题截断 */
            word-break: break-word;
        }
        /* 图标和文字可以自然排列，不需要额外改动，保留原有表情符号 */
        
        /* 移除水平滚动条相关样式，因为不再需要 */
        .nav-container::-webkit-scrollbar {
            display: none;
        }
        
        /* 针对小屏幕微调 */
        @media (max-width: 500px) {
            body {
                padding: 15px;
                justify-content: flex-start; /* 顶部对齐 */
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            .nav-card {
                padding: 18px 20px;
            }
            .nav-card h2 {
                font-size: 1.2rem;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <h1>🗂️ 简历</h1>
    
    <!-- 导航容器现在改为垂直排列 (flex-direction: column) -->
    <div class="nav-container">
        <a href="CV/3D-reconstruction-algorithm-engineer/index.html" class="nav-card">
            <h2>📄 三维重建算法工程师</h2>
        </a>
        <a href="CV/SLAM-algorithm-engineer/index.html" class="nav-card">
            <h2>📄 SLAM算法工程师</h2>
        </a>
        <a href="CV/deep-learning-high-performance-computing-engineer/index.html" class="nav-card">
            <h2>📄 深度学习高性能计算工程师</h2>
        </a>
        <a href="CV/research-scholar/index.html" class="nav-card">
            <h2>📄 科研学者</h2>
        </a>
    </div>

    <!-- 原来的滚动检测脚本已无用，但保留无妨；也可以移除。这里简单注释掉，避免干扰 -->
    <!-- <script>
        // 原水平滚动提示不再需要，但保留为空函数或删除均可
        const container = document.querySelector('.nav-container');
        const hint = document.getElementById('scrollHint');
        if (container && hint) hint.style.display = 'none';
    </script> -->
</body>
</html>
