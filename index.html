<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历导航</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 1200px;  /* 增加最大宽度以适应四个卡片 */
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
            margin-bottom: 40px;
        }
        .nav-container {
            display: flex;
            flex-wrap: nowrap;  /* 关键：禁止换行 */
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            overflow-x: auto;    /* 如果屏幕太小，允许水平滚动 */
            padding-bottom: 10px; /* 给滚动条留点空间 */
        }
        .nav-card {
            background: white;
            border-radius: 8px;
            padding: 30px 15px;
            min-width: 180px;    /* 设置最小宽度，防止被压缩 */
            width: 220px;         /* 固定宽度 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: #34495e;
            flex-shrink: 0;       /* 防止卡片被压缩 */
        }
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            background-color: #3498db;
            color: white;
        }
        .nav-card h2 {
            margin: 0;
            font-size: 16px;      /* 稍微调小字体以适应一行 */
            white-space: nowrap;   /* 标题文字不换行 */
        }
        
        /* 可选：美化滚动条（针对水平滚动的情况） */
        .nav-container::-webkit-scrollbar {
            height: 6px;
        }
        .nav-container::-webkit-scrollbar-track {
            background: #e0e7ef;
            border-radius: 3px;
        }
        .nav-container::-webkit-scrollbar-thumb {
            background: #3498db;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>🗺️ 简历</h1>
    <div class="nav-container">
        <a href="简历/感知算法工程师/index.html" class="nav-card">
            <h2>📄 感知算法工程师</h2>
        </a>
        <a href="简历/SLAM算法工程师/index.html" class="nav-card">
            <h2>📄 SLAM算法工程师</h2>
        </a>
        <a href="简历/深度学习高性能计算工程师/index.html" class="nav-card">
            <h2>📄 深度学习高性能计算工程师</h2>
        </a>
        <a href="简历/科研学者/index.html" class="nav-card">
            <h2>📄 科研学者</h2>
        </a>
    </div>
    
    <!-- 可选：提示信息，如果屏幕太小可以滚动查看 -->
    <p style="margin-top: 30px; color: #7f8c8d; font-size: 13px; display: none;" id="scrollHint">
        ⬅️ 如果屏幕太小，可以左右滑动查看更多 ➡️
    </p>

    <script>
        // 检测是否需要显示滚动提示
        const container = document.querySelector('.nav-container');
        const hint = document.getElementById('scrollHint');
        if (container.scrollWidth > container.clientWidth) {
            hint.style.display = 'block';
        }
    </script>
</body>
</html>
